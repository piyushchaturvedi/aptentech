# Transfer settings, installed to /etc/nginx/conf.d/aptentech-performance.conf
#
# Deliberately a separate file from aptentech.conf. That one holds the server blocks, and
# certbot rewrites it in place when it attaches a certificate — so the deploy leaves it alone
# once TLS is on. Everything here is http-level and belongs to no server block, so it can be
# rewritten on every deploy without touching the certificate wiring.

# ------------------------------------------------------------------ compression
#
# Worth having, but measured rather than assumed — and the measurement says this is a small
# win, not a large one.
#
# Next.js already compresses everything it serves: the home page is 181KB of HTML and arrives
# as 33KB. nginx passes that through untouched. So the HTML, the JS and the CSS were never
# uncompressed, and turning gzip on here changes nothing for them.
#
# What it does cover is the Express API behind /uploads/ and /api/health, which has no
# compression of its own. The media there is SVG — text, and compressible — though at 1-3KB a
# file the saving is a couple of kilobytes per image rather than anything dramatic.
#
# `gzip_proxied any` is the part that matters: without it nginx skips compression for exactly
# the responses that come from an upstream, which is all of them here.

gzip on;
gzip_vary on;
gzip_proxied any;

# 5 rather than the maximum. Levels above this cost noticeably more CPU for a percent or two of
# size, and this runs on a single shared vCPU that also hosts MongoDB and both Node processes.
gzip_comp_level 5;

# Below about 1KB the compressed result plus its header is not reliably smaller, and the round
# trip is dominated by latency rather than size.
gzip_min_length 1024;

gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/manifest+json
  image/svg+xml
  font/woff
  font/woff2;

# Images and fonts other than the two above arrive already compressed; running them through
# gzip spends CPU to make them marginally larger.

# ------------------------------------------------------------------ client-facing
#
# Send the response as it is produced rather than buffering it whole, and let the first packet
# leave immediately rather than waiting to fill.
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Long enough that a browser reuses one connection across a page's assets.
keepalive_timeout 65;

# The header is an invitation to fingerprint the exact nginx build against known advisories.
server_tokens off;
