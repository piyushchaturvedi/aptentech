# AptenTech — nginx reverse proxy
#
# Installed to /etc/nginx/conf.d/aptentech.conf by `npm run deploy:prod`.
#
# `server_name _` matches any host, which is what lets the site answer on the bare IP before a
# domain exists. Add the hostname here when DNS is pointed at this instance, then run certbot —
# it edits this file to add the certificate and the HTTP→HTTPS redirect.

server {
    listen 80 default_server;
    server_name _;

    # Uploads can be large; the API's own limit is 10 MB.
    client_max_body_size 12M;

    # ------------------------------------------------------------------ API health
    #
    # A single, deliberately narrow route to the Node API.
    #
    # The rest of the API is NOT exposed. `/api/v1/*` carries the admin endpoints and the
    # content read API, and the only client that should ever reach them is the Next.js server
    # over the loopback — publishing them would put the CMS on the open internet behind
    # nothing but a shared token.
    location = /api/health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ------------------------------------------------------------------ media
    #
    # Served by the API from this instance's disk while MEDIA_DRIVER=local. Proxied rather
    # than served by nginx directly, so the path keeps working unchanged if media ever moves
    # to S3 or a CDN.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------ everything else
    #
    # Including the site's own `/api/leads`, `/api/admin/*` and `/api/revalidate`, which are
    # Next.js route handlers rather than the Node API. Routing all of `/api/` to port 4000
    # would shadow them and break both the admin and the contact forms.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Without these the application sees nginx as every visitor: rate limiting then treats
        # the whole internet as one client, and every lead records the proxy's address rather
        # than the person's. `TRUST_PROXY=true` is the other half of this.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
